[package]
name = "firefinder-view"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Sight lines over terrain for Firefinder: the view from a lookout cab and what it could see, compiled to WebAssembly"
repository = "https://github.com/holdTheDoorHoid/firefinder"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
png = "0.18"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The tests march millions of rays; unoptimised they take minutes.
[profile.test]
opt-level = 2

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
