name: Build and publish the website

# Builds the site data from data/towers (or the sample fixtures while that folder is empty),
# tests it, builds the website with one prerendered page per lookout, and publishes it to
# GitHub Pages. Runs on every push to main, and on demand from the Actions tab.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test the data pipeline
        run: python3 -m unittest discover -s pipeline

      # --fallback-fixtures: while data/towers/ is still empty, build from the sample records
      # in web/fixtures/. The script then prints a large "USING FIXTURE DATA" banner, adds a
      # warning to this run's summary, and the site shows a "Sample data" notice. Once
      # data/towers/ has records the flag does nothing.
      - name: Build site data (falls back to fixtures if data/towers is empty)
        run: python3 pipeline/build_site_data.py --fallback-fixtures

      - name: Install website dependencies
        working-directory: web
        run: npm ci

      - name: Type-check and test the website
        working-directory: web
        run: |
          npm run check
          npm test

      - name: Build the website and prerender lookout pages
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
